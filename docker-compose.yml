name: market-data

services:
  spread-dashboard:
    image: ${SPREAD_IMAGE:?SPREAD_IMAGE must be set to an immutable release tag}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spread-dashboard
    command: streamlit run 05_apps/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      MARKET_DATA_GIT_HEAD: ${MARKET_DATA_GIT_HEAD:?MARKET_DATA_GIT_HEAD must be explicitly set}
      USDA_DASHBOARD_URL: ${USDA_DASHBOARD_URL:?USDA_DASHBOARD_URL must be explicitly set}
      OIL_WORLD_DASHBOARD_URL: ${OIL_WORLD_DASHBOARD_URL:?OIL_WORLD_DASHBOARD_URL must be explicitly set}
      WEATHER_DATA_DIR: /app/runtime/weather
    volumes:
      - ./01_data:/app/01_data
      - ./06_outputs:/app/06_outputs
      - ./10_logs:/app/10_logs
      - ${WEATHER_RUNTIME_CURRENT_DIR:?WEATHER_RUNTIME_CURRENT_DIR must be explicitly set}:/app/runtime/weather:ro
    restart: unless-stopped

  usda-dashboard:
    build:
      context: ./11_独立应用/USDA平衡表
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /usda/
    container_name: usda-dashboard
    ports:
      - "8080:80"
    restart: unless-stopped
