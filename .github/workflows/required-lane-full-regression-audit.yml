name: Required lane full regression comparison (diagnostic only)
'on':
  push:
    branches:
    - audit/required-lane-baseline-276cbc3
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONUTF8: '1'
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Use exact Git bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 276cbc3deff06b717c2e0dfef18505027f8558d4
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install development dependencies
      run: python -I -m pip install -r candidate/requirements-dev.in
    - name: Build exact comparison plan
      working-directory: candidate
      run: |
        python -I -B - <<'PY'
        import json
        import sys
        from pathlib import Path

        sys.path.insert(0, str(Path.cwd() / '04_scripts/quality'))
        import full_regression
        import platform_ci as ci

        repo = Path.cwd()
        base_commit = '1edae5372851b46464ed7e466f89268af8cda261'
        candidate_commit = '276cbc3deff06b717c2e0dfef18505027f8558d4'
        base = {
            'commit': base_commit,
            'tree': ci.admission.text(repo, 'rev-parse', base_commit + '^{tree}'),
        }
        candidate = {
            'commit': candidate_commit,
            'tree': ci.admission.text(repo, 'rev-parse', candidate_commit + '^{tree}'),
        }
        entries = ci.admission.tree(repo, candidate_commit)
        paths = sorted(path for path in entries if ci.admission.test_path(path))
        sources = {
            path: ci.admission.blob(repo, candidate_commit, path)
            for path in paths
        }
        policy = json.loads(
            ci.admission.blob(repo, candidate_commit, ci.POLICY)
        )
        all_tests = ci.platforms.plan(
            paths, sources, sources, policy, base=base, candidate=candidate
        )
        required = {
            'schema_version': 'platform-test-plan/1',
            'base': base,
            'candidate': candidate,
            'policy_sha256': all_tests['policy_sha256'],
            'lanes': {
                'linux': [],
                'windows': all_tests['lanes']['windows'],
            },
            'runners': all_tests['runners'],
            'candidate_test_sha256': all_tests['candidate_test_sha256'],
        }
        required['plan_sha256'] = ci.platforms.digest(required)
        output = Path(__import__('os').environ['RUNNER_TEMP']) / 'full-plan'
        ci.save(output / 'required-plan.json', required)
        full_regression.make_plan(repo, required, output / 'full-plan.json')
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: exact-full-plan
        path: ${{ runner.temp }}/full-plan
        if-no-files-found: error

  full:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
        - side: base
          commit: 1edae5372851b46464ed7e466f89268af8cda261
        - side: candidate
          commit: 276cbc3deff06b717c2e0dfef18505027f8558d4
    steps:
    - name: Use exact Git bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.commit }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install development dependencies
      run: python -I -m pip install -r candidate/requirements-dev.in
    - name: Provision supported Chinese fonts
      working-directory: candidate
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig
        fc-cache -f
        python -I -B - <<'PY'
        import sys
        from pathlib import Path
        sys.path.insert(0, str(Path.cwd() / '03_src'))
        from agri_research_agent.utils.matplotlib_config import configure_matplotlib_chinese_fonts
        selected = configure_matplotlib_chinese_fonts()[0]
        assert selected in {'Noto Sans CJK SC', 'Noto Sans CJK JP'}, selected
        PY
    - uses: actions/download-artifact@v4
      with:
        name: exact-full-plan
        path: ${{ runner.temp }}/full-plan
    - name: Execute exact full regression side
      working-directory: candidate
      run: >-
        python -I -B 04_scripts/quality/full_regression.py run
        --plan "$RUNNER_TEMP/full-plan/full-plan.json"
        --side "${{ matrix.side }}"
        --output "$RUNNER_TEMP/full-results/${{ matrix.side }}"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: full-${{ matrix.side }}
        path: ${{ runner.temp }}/full-results/${{ matrix.side }}
        if-no-files-found: error

  compare:
    needs:
    - plan
    - full
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 276cbc3deff06b717c2e0dfef18505027f8558d4
        path: candidate
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install development dependencies
      run: python -I -m pip install -r candidate/requirements-dev.in
    - uses: actions/download-artifact@v4
      with:
        name: exact-full-plan
        path: ${{ runner.temp }}/full-plan
    - uses: actions/download-artifact@v4
      with:
        name: full-base
        path: ${{ runner.temp }}/full-results/base
    - uses: actions/download-artifact@v4
      with:
        name: full-candidate
        path: ${{ runner.temp }}/full-results/candidate
    - name: Compare exact node outcomes
      working-directory: candidate
      env:
        FULL_JOB_RESULT: success
      run: >-
        python -I -B 04_scripts/quality/full_regression.py compare
        --plan "$RUNNER_TEMP/full-plan/full-plan.json"
        --receipts "$RUNNER_TEMP/full-results"
        --output "$RUNNER_TEMP/full-comparison.json"
    - name: Report comparison
      run: cat "$RUNNER_TEMP/full-comparison.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: full-comparison
        path: ${{ runner.temp }}/full-comparison.json
        if-no-files-found: error
