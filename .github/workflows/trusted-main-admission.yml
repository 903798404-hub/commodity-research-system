# Maintainer-reviewed candidate CI; production release remains separate.
name: trusted-main-admission-v1
'on':
  push:
    branches:
    - feat/**
    - fix/**
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONUTF8: '1'
concurrency:
  group: admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
    - name: Use exact Git bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install development dependencies
      run: python -I -m pip install -r candidate/requirements-dev.in
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: main
        path: base
        persist-credentials: false
    - name: Plan exact candidate and baseline
      id: plan
      working-directory: candidate
      run: python -I -B 04_scripts/quality/platform_ci.py plan --base "$(git -C ../base rev-parse HEAD)" --candidate "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/platform-plan"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: platform-plan
        path: ${{ runner.temp }}/platform-plan
        if-no-files-found: error
  linux:
    name: trusted-main-admission-linux
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - name: Use exact Git bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install development dependencies
      run: python -I -m pip install -r candidate/requirements-dev.in
    - uses: actions/download-artifact@v4
      with:
        name: platform-plan
        path: ${{ runner.temp }}/platform-plan
    - name: Execute required linux tests
      working-directory: candidate
      run: python -I -B 04_scripts/quality/platform_ci.py run --platform linux --plan "$RUNNER_TEMP/platform-plan/plan.json" --output "$RUNNER_TEMP/platform-results/linux"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: platform-linux
        path: ${{ runner.temp }}/platform-results/linux
        if-no-files-found: error
  windows:
    name: trusted-main-admission-windows
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
    - name: Use exact Git bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install development dependencies
      run: python -I -m pip install -r candidate/requirements-dev.in
    - uses: actions/download-artifact@v4
      with:
        name: platform-plan
        path: ${{ runner.temp }}/platform-plan
    - name: Execute required windows tests
      working-directory: candidate
      run: python -I -B 04_scripts/quality/platform_ci.py run --platform windows --plan "$RUNNER_TEMP/platform-plan/plan.json" --output "$RUNNER_TEMP/platform-results/windows"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: platform-windows
        path: ${{ runner.temp }}/platform-results/windows
        if-no-files-found: error
  final:
    name: trusted-main-admission-v1
    if: always()
    needs:
    - plan
    - linux
    - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Use exact Git bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install development dependencies
      run: python -I -m pip install -r candidate/requirements-dev.in
    - uses: actions/download-artifact@v4
      with:
        name: platform-plan
        path: ${{ runner.temp }}/platform-plan
    - uses: actions/download-artifact@v4
      with:
        pattern: platform-linux
        path: ${{ runner.temp }}/platform-results/linux
        merge-multiple: true
    - uses: actions/download-artifact@v4
      with:
        pattern: platform-windows
        path: ${{ runner.temp }}/platform-results/windows
        merge-multiple: true
    - name: Require plan and fresh main
      env:
        PLAN_RESULT: ${{ needs.plan.result }}
      working-directory: candidate
      run: |-
        test "$PLAN_RESULT" = success
        python -I - <<'PY'
        import json,os,subprocess
        from pathlib import Path
        p=json.loads((Path(os.environ['RUNNER_TEMP'])/'platform-plan/plan.json').read_text())
        assert subprocess.check_output(['git','ls-remote','origin','refs/heads/main'],text=True).split()[0] == p['base']['commit'], 'MAIN_MOVED'
        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == p['candidate']['commit'], 'CANDIDATE_CHANGED'
        PY
    - name: Aggregate actual required platform jobs
      working-directory: candidate
      env:
        PLATFORM_JOB_RESULTS: '{"linux":"${{ needs.linux.result }}","windows":"${{ needs.windows.result }}"}'
      run: python -I -B 04_scripts/quality/platform_ci.py aggregate --plan "$RUNNER_TEMP/platform-plan/plan.json" --receipts "$RUNNER_TEMP/platform-results" --output
        "$RUNNER_TEMP/final-admission/main-admission.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: main-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/final-admission
        if-no-files-found: error
