name: trusted-main-admission-v1
'on':
  push:
    branches:
    - feat/**
    - fix/**
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONUTF8: '1'
concurrency:
  group: admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      full: ${{ steps.plan.outputs.full }}
      base_commit: ${{ steps.plan.outputs.base_commit }}
      spread_runtime_docker: ${{ steps.plan.outputs.spread_runtime_docker }}
    steps:
    - name: Use exact Git bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install development dependencies
      run: python -I -m pip install -r candidate/requirements-dev.in
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: main
        path: base
        persist-credentials: false
    - name: Plan exact candidate and baseline
      id: plan
      working-directory: candidate
      run: python -I -B 04_scripts/quality/platform_ci.py plan --base "$(git -C ../base
        rev-parse HEAD)" --candidate "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/platform-plan"
    - name: Plan full repository comparison
      if: steps.plan.outputs.full == 'true'
      working-directory: candidate
      run: python -I -B 04_scripts/quality/full_regression.py plan --plan "$RUNNER_TEMP/platform-plan/plan.json"
        --output "$RUNNER_TEMP/platform-plan/full-plan.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: platform-plan
        path: ${{ runner.temp }}/platform-plan
        if-no-files-found: error
  linux:
    name: trusted-main-admission-linux
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Use exact Git bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install development dependencies
      run: python -I -m pip install -r candidate/requirements-dev.in
    - uses: actions/download-artifact@v4
      with:
        name: platform-plan
        path: ${{ runner.temp }}/platform-plan
    - name: Provision and verify supported Chinese fonts
      working-directory: candidate
      run: "sudo apt-get update\nsudo apt-get install -y --no-install-recommends fonts-noto-cjk\
        \ fontconfig\nfc-cache -f\npython -I -B - <<'PY'\nimport json, os, platform,\
        \ subprocess, sys\nfrom pathlib import Path\nsys.path.insert(0, str(Path.cwd()\
        \ / '03_src'))\nfrom agri_research_agent.utils.matplotlib_config import configure_matplotlib_chinese_fonts\n\
        from matplotlib import font_manager\nselected = configure_matplotlib_chinese_fonts()[0]\n\
        assert selected in {'Noto Sans CJK SC', 'Noto Sans CJK JP'}, selected\nsystem_family\
        \ = subprocess.check_output(['fc-match', '-f', '%{family}', selected], text=True).strip()\n\
        assert selected in system_family.split(','), system_family\nfont_path = font_manager.findfont(font_manager.FontProperties(family=[selected]),\
        \ fallback_to_default=False)\nresolved = font_manager.FontProperties(fname=font_path).get_name()\n\
        assert resolved == selected, (selected, resolved)\nevidence = dict(package='fonts-noto-cjk',\
        \ package_version=subprocess.check_output(\n    ['dpkg-query', '-W', '-f=${Version}',\
        \ 'fonts-noto-cjk'], text=True),\n    runner_os=os.environ['RUNNER_OS'], os_release=platform.freedesktop_os_release(),\n\
        \    system_family=system_family, configured_family=selected, resolved_family=resolved,\n\
        \    font_path=font_path, result='PASS')\noutput = Path(os.environ['RUNNER_TEMP'])\
        \ / 'platform-results/linux/font-check.json'\noutput.parent.mkdir(parents=True,\
        \ exist_ok=True)\noutput.write_text(json.dumps(evidence, indent=2) + '\\n',\
        \ encoding='utf-8')\nprint(json.dumps(evidence, indent=2))\nPY\n"
    - name: Prepare deterministic required fixtures
      working-directory: candidate
      run: |
        python -I -B 04_scripts/quality/required_lane_fixtures.py --source-root . --output "$RUNNER_TEMP/required-fixtures"
        echo "SPREAD_REFERENCE_DATA_ROOT=$RUNNER_TEMP/required-fixtures/spread-reference" >> "$GITHUB_ENV"
        echo "PUBLIC_MARKET_DATA_RUNTIME_ROOT=$RUNNER_TEMP/required-fixtures/public-runtime" >> "$GITHUB_ENV"
    - name: Execute required linux tests
      working-directory: candidate
      env:
        APPLICATION_RUNTIME_ACCIDENT_EVIDENCE: ${{ runner.temp }}/platform-results/linux/application-runtime-incident.json
      run: python -I -B 04_scripts/quality/platform_ci.py run --platform linux --plan
        "$RUNNER_TEMP/platform-plan/plan.json" --output "$RUNNER_TEMP/platform-results/linux"
    - name: Validate real spread-runtime image with ephemeral candidate trust
      if: needs.plan.outputs.spread_runtime_docker == 'true'
      working-directory: candidate
      run: |
        set -euo pipefail
        source_root="/root/market-data-spread-hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        test ! -e "$source_root"
        candidate_commit="$(git rev-parse HEAD)"
        candidate_tree="$(git rev-parse 'HEAD^{tree}')"
        test "$candidate_commit" = "$(python -I -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/platform-plan/plan.json"))["candidate"]["commit"])')"
        sudo git -c safe.directory="$PWD" clone --local --no-hardlinks --no-checkout "$PWD" "$source_root"
        sudo git -C "$source_root" checkout --detach "$candidate_commit"
        test "$(sudo git -C "$source_root" rev-parse 'HEAD^{tree}')" = "$candidate_tree"
        python_bin="$(command -v python)"
        sudo GITHUB_RUN_ID="$GITHUB_RUN_ID" "$python_bin" -I -B \
          "$source_root/04_scripts/runtime/validate_target_runtime.py" \
          --project spread-production-runtime-wiring \
          --runtime-contract 02_configs/runtime_contracts/spread-production-runtime.json \
          --ephemeral-candidate-trust \
          --evidence-output "$RUNNER_TEMP/platform-results/linux/spread-runtime-hosted-evidence.json"
        sudo "$python_bin" -I -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["TARGET_RUNTIME_CONTAINER_VALIDATION"]=="PASS"; e=p["spread_runtime_packaging"]; assert e["identity_kind"]=="EPHEMERAL_CI_CANDIDATE_VALIDATION_ROOT" and e["private_key_persisted"] is False and e["private_key_visible_to_container"] is False; assert not e["import_closure"]["missing_from_final_image"] and e["readonly_initialization"]["status"]=="PASS"' \
          "$RUNNER_TEMP/platform-results/linux/spread-runtime-hosted-evidence.json"
    - name: Execute required real Docker application service identity evidence
      working-directory: candidate
      run: |
        set -euo pipefail
        source_root="/root/market-data-hosted-service-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        test ! -e "$source_root"
        sudo install -d -m 0755 "$source_root"
        sudo cp -a 02_configs 03_src 09_deploy "$source_root/"
        sudo install -d -m 0755 "$source_root/08_tests/shared"
        sudo cp 08_tests/shared/application_service_docker_e2e.py "$source_root/08_tests/shared/"
        sudo chown -R root:root "$source_root"
        sudo chmod -R go-w "$source_root"
        python_bin="$(command -v python)"
        sudo "$python_bin" -I -B "$source_root/08_tests/shared/application_service_docker_e2e.py" \
          --candidate-commit "$(git rev-parse HEAD)" \
          --candidate-tree "$(git rev-parse 'HEAD^{tree}')" \
          --output "$RUNNER_TEMP/platform-results/linux/application-service-identity-docker-evidence.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: platform-linux
        path: ${{ runner.temp }}/platform-results/linux
        if-no-files-found: error
  windows:
    name: trusted-main-admission-windows
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
    - name: Use exact Git bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install development dependencies
      run: python -I -m pip install -r candidate/requirements-dev.in
    - uses: actions/download-artifact@v4
      with:
        name: platform-plan
        path: ${{ runner.temp }}/platform-plan
    - name: Execute required windows tests
      working-directory: candidate
      run: python -I -B 04_scripts/quality/platform_ci.py run --platform windows --plan
        "$RUNNER_TEMP/platform-plan/plan.json" --output "$RUNNER_TEMP/platform-results/windows"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: platform-windows
        path: ${{ runner.temp }}/platform-results/windows
        if-no-files-found: error
  final:
    name: trusted-main-admission-v1
    if: always()
    needs:
    - plan
    - linux
    - windows
    - full
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Use exact Git bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install aggregation dependency
      run: python -I -m pip install PyYAML==6.0.3 jsonschema==4.26.0
    - uses: actions/download-artifact@v4
      with:
        name: platform-plan
        path: ${{ runner.temp }}/platform-plan
    - uses: actions/download-artifact@v4
      with:
        pattern: platform-linux
        path: ${{ runner.temp }}/platform-results/linux
        merge-multiple: true
    - uses: actions/download-artifact@v4
      with:
        pattern: platform-windows
        path: ${{ runner.temp }}/platform-results/windows
        merge-multiple: true
    - name: Require plan and fresh main
      env:
        PLAN_RESULT: ${{ needs.plan.result }}
        MAIN_READ_TOKEN: ${{ github.token }}
      working-directory: candidate
      run: "test \"$PLAN_RESULT\" = success\npython -I - <<'PY'\nimport json,os,subprocess,urllib.request\n\
        from pathlib import Path\np=json.loads((Path(os.environ['RUNNER_TEMP'])/'platform-plan/plan.json').read_text())\n\
        request=urllib.request.Request(os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/main',headers={'Authorization':'Bearer\
        \ '+os.environ['MAIN_READ_TOKEN'],'Accept':'application/vnd.github+json'})\n\
        with urllib.request.urlopen(request,timeout=30) as response:\n    current_main=json.load(response)['object']['sha']\n\
        assert current_main == p['base']['commit'], 'MAIN_MOVED'\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()\
        \ == p['candidate']['commit'], 'CANDIDATE_CHANGED'\nPY"
    - uses: actions/download-artifact@v4
      if: needs.plan.outputs.full == 'true'
      with:
        name: full-base
        path: ${{ runner.temp }}/full-results/base
    - uses: actions/download-artifact@v4
      if: needs.plan.outputs.full == 'true'
      with:
        name: full-candidate
        path: ${{ runner.temp }}/full-results/candidate
    - name: Compare exact base and candidate full regression
      if: needs.plan.outputs.full == 'true'
      working-directory: candidate
      env:
        FULL_JOB_RESULT: ${{ needs.full.result }}
      run: python -I -B 04_scripts/quality/full_regression.py compare --plan "$RUNNER_TEMP/platform-plan/full-plan.json"
        --receipts "$RUNNER_TEMP/full-results" --output "$RUNNER_TEMP/final-admission/full-regression.json"
    - name: Aggregate actual required platform jobs
      working-directory: candidate
      env:
        PLATFORM_JOB_RESULTS: '{"linux":"${{ needs.linux.result }}","windows":"${{
          needs.windows.result }}"}'
      run: python -I -B 04_scripts/quality/platform_ci.py aggregate --plan "$RUNNER_TEMP/platform-plan/plan.json"
        --receipts "$RUNNER_TEMP/platform-results" --output "$RUNNER_TEMP/final-admission/main-admission.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: main-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/final-admission
        if-no-files-found: error
  full:
    name: full-regression-${{ matrix.side }}
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        side:
        - base
        - candidate
    steps:
    - name: Use exact Git bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.side == 'base' && needs.plan.outputs.base_commit || github.event.pull_request.head.sha
          || github.sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: executor
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install development dependencies
      run: python -I -m pip install -r candidate/requirements-dev.in
    - uses: actions/download-artifact@v4
      with:
        name: platform-plan
        path: ${{ runner.temp }}/platform-plan
    - name: Provision and verify supported Chinese fonts
      working-directory: candidate
      run: "sudo apt-get update\nsudo apt-get install -y --no-install-recommends fonts-noto-cjk\
        \ fontconfig\nfc-cache -f\npython -I -B - <<'PY'\nimport json, os, platform,\
        \ subprocess, sys\nfrom pathlib import Path\nsys.path.insert(0, str(Path.cwd()\
        \ / '03_src'))\nfrom agri_research_agent.utils.matplotlib_config import configure_matplotlib_chinese_fonts\n\
        from matplotlib import font_manager\nselected = configure_matplotlib_chinese_fonts()[0]\n\
        assert selected in {'Noto Sans CJK SC', 'Noto Sans CJK JP'}, selected\nsystem_family\
        \ = subprocess.check_output(['fc-match', '-f', '%{family}', selected], text=True).strip()\n\
        assert selected in system_family.split(','), system_family\nfont_path = font_manager.findfont(font_manager.FontProperties(family=[selected]),\
        \ fallback_to_default=False)\nresolved = font_manager.FontProperties(fname=font_path).get_name()\n\
        assert resolved == selected, (selected, resolved)\nevidence = dict(package='fonts-noto-cjk',\
        \ package_version=subprocess.check_output(\n    ['dpkg-query', '-W', '-f=${Version}',\
        \ 'fonts-noto-cjk'], text=True),\n    runner_os=os.environ['RUNNER_OS'], os_release=platform.freedesktop_os_release(),\n\
        \    system_family=system_family, configured_family=selected, resolved_family=resolved,\n\
        \    font_path=font_path, result='PASS')\noutput = Path(os.environ['RUNNER_TEMP'])\
        \ / 'platform-results/linux/font-check.json'\noutput.parent.mkdir(parents=True,\
        \ exist_ok=True)\noutput.write_text(json.dumps(evidence, indent=2) + '\\n',\
        \ encoding='utf-8')\nprint(json.dumps(evidence, indent=2))\nPY\n"
    - name: Prepare deterministic required fixtures
      working-directory: candidate
      run: |
        python -I -B ../executor/04_scripts/quality/required_lane_fixtures.py --source-root . --output "$RUNNER_TEMP/required-fixtures"
        echo "SPREAD_REFERENCE_DATA_ROOT=$RUNNER_TEMP/required-fixtures/spread-reference" >> "$GITHUB_ENV"
        echo "PUBLIC_MARKET_DATA_RUNTIME_ROOT=$RUNNER_TEMP/required-fixtures/public-runtime" >> "$GITHUB_ENV"
    - name: Execute complete full regression
      working-directory: candidate
      run: python -I -B ../executor/04_scripts/quality/full_regression.py run --side
        "${{ matrix.side }}" --plan "$RUNNER_TEMP/platform-plan/full-plan.json" --output
        "$RUNNER_TEMP/full-results"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: full-${{ matrix.side }}
        path: ${{ runner.temp }}/full-results
        if-no-files-found: error
