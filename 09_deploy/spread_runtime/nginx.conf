# The existing spread-dashboard container owns the same public port, 8501.
# Only immutable framework assets bypass Streamlit; all business HTTP and
# WebSocket traffic continues through the original application.
worker_processes 1;
pid /runtime/10_logs/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    gzip off;
    gzip_vary on;
    client_body_temp_path /runtime/10_logs/nginx-body;
    proxy_temp_path /runtime/10_logs/nginx-proxy;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8501;
        server_name _;
        # Streamlit continues enforcing its own upload size contract.
        client_max_body_size 0;

        location /static/ {
            root /usr/local/lib/python3.12/site-packages/streamlit/static;
            gzip_static on;
            gzip_proxied any;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            proxy_pass http://127.0.0.1:8502;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
