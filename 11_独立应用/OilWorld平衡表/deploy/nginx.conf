server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    location = / {
        return 302 /oil-world/;
    }

    location = /oil-world {
        return 301 /oil-world/;
    }

    location = /oil-world/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The sealed candidate identity is an actual JSON resource, not an SPA
    # route.  Keep it out of the generic /oil-world/ index fallback so the
    # release verifier can prove the running image identity.
    location = /oil-world/RELEASE.json {
        alias /usr/share/nginx/html/oil-world/RELEASE.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /oil-world/data/oil_world/latest.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        error_page 404 = @oil_world_json_not_found;
        try_files $uri =404;
    }

    location = /oil-world/data/oil_world/releases.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        error_page 404 = @oil_world_json_not_found;
        try_files $uri =404;
    }

    location ^~ /oil-world/data/oil_world/releases/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        error_page 404 = @oil_world_json_not_found;
        try_files $uri =404;
    }

    location ^~ /oil-world/data/oil_world/comparisons/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        error_page 404 = @oil_world_json_not_found;
        try_files $uri =404;
    }

    location ^~ /oil-world/data/oil_world/ {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        error_page 404 = @oil_world_json_not_found;
        try_files $uri =404;
    }

    location @oil_world_json_not_found {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404 '{"error":"not_found"}';
    }

    location ^~ /oil-world/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /oil-world/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /oil-world/index.html;
    }
}
