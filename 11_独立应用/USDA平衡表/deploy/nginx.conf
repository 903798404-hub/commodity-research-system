server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = / {
        return 302 /usda/;
    }

    location = /usda/data/current.json {
        alias /runtime/usda/current.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location ~ "^/usda/data/releases/(usda-[0-9]{4}-(?:0[1-9]|1[0-2])-[0-9a-f]{16})/data/([A-Za-z0-9_-][A-Za-z0-9_.-]*(?:/[A-Za-z0-9_-][A-Za-z0-9_.-]*)*\.json)$" {
        alias /runtime/usda/releases/$1/data/$2;
        default_type application/json;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /usda/data/ {
        return 404;
    }

    location /usda/ {
        try_files $uri $uri/ /usda/index.html;
    }

    location ~* ^/usda/assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
