rapeseed_weather:
  crop: rapeseed
  crop_display_name: 菜籽
  country: UKR
  country_display_name: 乌克兰
  page_title: 乌克兰菜籽天气研究
  data_slug: ukr
  source_table_prefix: 乌克兰
  season_mode: crop_year
  season_label_style: range
  season_start_month_day: "09-01"
  season_end_month_day: "08-31"
  weighted_aggregation: false
  title_template: "{region}"
