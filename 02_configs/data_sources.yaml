akshare:
  enabled: true
  type: api
  update_frequency: daily
  description: 国内期货行情、部分现货和市场数据

usda:
  enabled: true
  type: report
  update_frequency: monthly
  description: 全球油籽、豆类、油脂油粕供需报告

mpob:
  enabled: true
  type: report
  update_frequency: monthly
  description: 马来西亚棕榈油产量、出口、库存数据

customs:
  enabled: true
  type: manual_or_file
  update_frequency: monthly
  description: 中国海关进出口数据

basis_sql:
  enabled: true
  type: navicat_sql_dump
  update_frequency: daily
  description: 油脂油料价格 SQL 中的 basis_price 表，仅抽取现货基差并按近月合约聚合
  path: 01_data/manual/榨利表/油脂油料价格.sql

basis_excel_backup:
  enabled: false
  type: read_only_reference
  update_frequency: manual
  description: 历史国内现货基差 Excel，仅作备份和人工核对，不再生成正式 Parquet
  path: 01_data/manual/basis/国内现货基差.xlsx
