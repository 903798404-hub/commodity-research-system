schema_version: 1

# 展示权重仅用于页面排序和州名展示，不参与美国全国值计算。
weight_role: display_only
weight_source: user_provided
weight_vintage: unknown

data_files:
  progress:
    preferred: soybeans_crop_progress_weekly.parquet
    fallback: soybeans_crop_progress_weekly_2021_2026.parquet
  condition:
    preferred: soybeans_crop_condition_weekly.parquet
    fallback: soybeans_crop_condition_weekly_2021_2026.parquet

national:
  region_name: US TOTAL
  display_name: 美国全国

metrics:
  - metric: PLANTED
    source: progress
    tab_label: 播种率
    display_name: 美豆播种率
  - metric: EMERGED
    source: progress
    tab_label: 出苗率
    display_name: 美豆出苗率
  - metric: BLOOMING
    source: progress
    tab_label: 开花率
    display_name: 美豆开花率
  - metric: SETTING_PODS
    source: progress
    tab_label: 结荚率
    display_name: 美豆结荚率
  - metric: HARVESTED
    source: progress
    tab_label: 收割率
    display_name: 美豆收割率
  - metric: GOOD_EXCELLENT
    source: condition
    tab_label: 优良率
    display_name: 美豆优良率

