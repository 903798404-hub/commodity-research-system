schema_version: 1
status_values:
  - production
  - pending_verification
  - retired
server_project_root: /home/ubuntu/market-data

applications:
  - app_id: main_dashboard
    display_name: 主工作台
    status: production
    project_path: .
    server_project_path: /home/ubuntu/market-data
    application_type: streamlit_dashboard
    production_url: http://124.222.106.25:8501/
    container_name: spread-dashboard
    host_port: 8501
    container_port: 8501
    healthcheck:
      type: http
      path: /
      expected_status: 200
      container_healthcheck: not_configured
    data_inputs:
      - type: external_api
        name: AkShare futures spot data
      - type: repository_runtime_path
        path: 01_data/historical_price_long.xlsx
      - type: repository_runtime_path
        path: 01_data/manual/basis/国内现货基差.xlsx
    runtime_data:
      - repository_path: 01_data/historical_spread_database.xlsx
        server_path: /home/ubuntu/market-data/01_data/historical_spread_database.xlsx
      - repository_path: 01_data/historical_spread_database.parquet
        server_path: /home/ubuntu/market-data/01_data/historical_spread_database.parquet
      - repository_path: 01_data/database/basis/basis_quotes.parquet
        server_path: /home/ubuntu/market-data/01_data/database/basis/basis_quotes.parquet
      - repository_path: 01_data/update_status.json
        server_path: /home/ubuntu/market-data/01_data/update_status.json
    release_data: []
    logs:
      - /home/ubuntu/market-data/10_logs/cron_update_spreads.log
      - /home/ubuntu/market-data/10_logs/server_update_spreads_YYYYMMDD.log
      - docker logs spread-dashboard
    update_method:
      basis: manual_excel_upload_then_validated_atomic_update
      spreads: automatic_weekdays_16_30_cst_and_manual_retry
    update_command:
      basis: docker exec spread-dashboard python /app/04_scripts/update_basis_data.py
      spreads: docker exec spread-dashboard python /app/04_scripts/server_update_spreads.py --update-from-akshare
    deploy_method: root_compose_build_and_replace_only_spread_dashboard
    source_revision_policy: build_from_an_explicit_verified_full_git_sha
    retention_policy:
      data: keep_current_production_files; basis_history_is_kept_in_the_user_external_backup
      images: keep_current_image_and_one_verified_rollback_image
      logs: fixed_retention_period_pending_confirmation
    dependencies:
      - Python dependencies from requirements.txt
      - persistent bind mounts for 01_data, 06_outputs and 10_logs
      - AkShare availability for automatic spread updates
    notes:
      - The container has no configured Docker healthcheck; use HTTP, update_status.json and logs.
      - Basis data updates and code deployment are separate operations.

  - app_id: usda_dashboard
    display_name: USDA平衡表
    status: production
    project_path: 11_独立应用/USDA平衡表
    server_project_path: /home/ubuntu/market-data/11_独立应用/USDA平衡表
    application_type: vite_react_static_nginx
    production_url: http://124.222.106.25:8080/
    container_name: usda-dashboard
    host_port: 8080
    container_port: 80
    healthcheck:
      type: http
      path: /usda/
      expected_status: 200
      container_healthcheck: not_configured
    data_inputs:
      - type: external_source
        name: USDA Foreign Agricultural Service PS&D export
      - type: repository_runtime_pattern
        path: 11_独立应用/USDA平衡表/data/raw/usda_psd/{YYYY-MM}/
      - type: repository_config
        path: 11_独立应用/USDA平衡表/configs/usda_report_version.json
    runtime_data: []
    release_data:
      - 11_独立应用/USDA平衡表/public/data/
      - 11_独立应用/USDA平衡表/data/snapshots/usda_psd/{YYYY-MM}/
    logs:
      - docker logs usda-dashboard
    update_method: local_monthly_source_build_validation_commit_and_targeted_image_deployment
    update_command:
      build_data: pnpm run build:data
      check_data: pnpm run check:data
      compare_snapshots: pnpm run compare:data
    deploy_method: root_compose_build_and_replace_only_usda_dashboard
    source_revision_policy: build_from_an_explicit_verified_full_git_sha
    retention_policy:
      data: keep_current_and_configured_previous_processed_snapshots; never_delete_the_only_raw_source
      images: keep_current_image_and_one_verified_rollback_image
      logs: docker_log_retention_period_pending_confirmation
    dependencies:
      - Node.js and pnpm lockfile environment
      - one valid source dataset for the configured report month
      - generated public/data included in the image build context
    notes:
      - The root URL redirects to /usda/.
      - Automated production data acquisition is pending verification; do not assume fetch:usda is scheduled.
      - The container has no configured Docker healthcheck.

  - app_id: oil_world_dashboard
    display_name: Oil World平衡表
    status: production
    project_path: 11_独立应用/OilWorld平衡表
    server_project_path: /home/ubuntu/market-data/11_独立应用/OilWorld平衡表
    application_type: vite_react_static_nginx_with_read_only_release_mount
    production_url: http://124.222.106.25:8081/oil-world/
    container_name: oil-world-dashboard
    host_port: 8081
    container_port: 80
    healthcheck:
      type: docker_healthcheck
      command_path: 11_独立应用/OilWorld平衡表/deploy/healthcheck.sh
      path: /oil-world/
      expected_status: 200
      container_healthcheck: configured
    data_inputs:
      - type: external_raw_root
        path_setting: OILWORLD_RAW_DATA_ROOT
        layout: "{raw_root}/{YYYY-MM}/"
      - type: repository_config
        path: 11_独立应用/OilWorld平衡表/02_configs/release_2026-06.json
      - type: repository_audit_mapping
        path: 11_独立应用/OilWorld平衡表/07_docs/报表映射审计/
    runtime_data:
      - host_path: pending_verification; supplied_by_OIL_WORLD_DATA_ROOT
        container_path: /usr/share/nginx/html/oil-world/data/oil_world
        access: read_only
    release_data:
      - 11_独立应用/OilWorld平衡表/public/data/oil_world/latest.json
      - 11_独立应用/OilWorld平衡表/public/data/oil_world/releases.json
      - 11_独立应用/OilWorld平衡表/public/data/oil_world/releases/{YYYY-MM}/
      - 11_独立应用/OilWorld平衡表/public/data/oil_world/comparisons/{previous}_to_{current}/
    logs:
      - docker logs oil-world-dashboard
    update_method: local_quarterly_immutable_release_and_comparison_then_pointer_update
    update_command:
      validate: python 04_scripts/update_oil_world.py --release YYYY-MM --validate-only
      publish: python 04_scripts/update_oil_world.py --release YYYY-MM
    deploy_method: oil_world_compose_for_frontend; release_data_hot_update_uses_read_only_mount
    source_revision_policy: build_from_an_explicit_verified_full_git_sha
    retention_policy:
      data: keep_all_releases_and_comparisons_referenced_by_releases_json; never_delete_the_only_raw_source
      images: keep_current_image_and_one_verified_rollback_image
      logs: docker_log_retention_period_pending_confirmation
    dependencies:
      - OILWORLD_RAW_DATA_ROOT or ignored local_paths.json for local release generation
      - Python and openpyxl for release generation
      - Node.js and pnpm for frontend tests and builds
      - read-only production release-data mount
    notes:
      - "Presentation URL: http://124.222.106.25:8081/oil-world/presentation"
      - Brazil Soybeans and Argentina Sunflowerseed use Jan-Dec calendar-year scope and must not be compared with crop-year series.
      - Repository Compose defaults to a loopback host bind; the next deployment must verify how the confirmed public endpoint is exposed.
