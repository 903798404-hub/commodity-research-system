palm_oil_weather:
  crop: palm_oil
  crop_display_name: 棕榈油
  country: MYS
  country_display_name: 马来
  page_title: 马来西亚棕榈油天气研究
  data_slug: mys
  source_table_prefix: 马来
  season_mode: natural_year
  season_label_style: year
  season_start_month_day: "01-01"
  weighted_aggregation: false
  title_template: "{country}_{region}（{importance_label}）"
  coverage_caption: "直接展示10个马来西亚稳定地区序列；标签权重合计99%，仅用于地区重要性说明，不生成全国加权结果。"
  enabled_sections:
    rainfall_summary: false
    temperature_summary: false
    daily_rainfall: true
    cumulative_rainfall: true
    maximum_temperature: true
    minimum_temperature: false
    soil_moisture: true
  chart_windows:
    cumulative_rain: {start: "01-01", end: "12-31"}
    temperature: {start: "01-01", end: "12-31"}
    soil: {start: "01-01", end: "12-31"}
  chart_axis:
    soil: {tick_interval_days: 30, tick_angle: -45, bottom_margin: 70}
  regions:
    - {key: sabah, display_name: 沙巴州, display_order: 1, source_column: "Sabah state (MYS)", importance_label: "23.6%"}
    - {key: sarawak, display_name: 砂拉越州, display_order: 2, source_column: "Sarawak state (MYS)", importance_label: "21.8%"}
    - {key: pahang, display_name: 彭亨州, display_order: 3, source_column: "Pahang state (MYS)", importance_label: "16%"}
    - {key: johor, display_name: 柔佛州, display_order: 4, source_column: "Johor state (MYS)", importance_label: "16%"}
    - {key: perak, display_name: 霹雳州, display_order: 5, source_column: "Perak state (MYS)", importance_label: "10%"}
    - {key: negeri_sembilan, display_name: 森美兰州, display_order: 6, source_column: "Negeri Sembilan state (MYS)", importance_label: "3.5%"}
    - {key: selangor, display_name: 雪兰莪州, display_order: 7, source_column: "Selangor state (MYS)", importance_label: "2.7%"}
    - {key: terengganu, display_name: 登嘉楼州, display_order: 8, source_column: "Terengganu state (MYS)", importance_label: "2.4%"}
    - {key: kelantan, display_name: 吉兰丹州, display_order: 9, source_column: "Kelantan state (MYS)", importance_label: "1.8%"}
    - {key: kedah, display_name: 吉打州, display_order: 10, source_column: "Kedah state (MYS)", importance_label: "1.2%"}
  metrics:
    precipitation: {display_name: 降雨, unit: mm, weekly_aggregation: sum}
    temperature_max: {display_name: 最高气温, unit: degC, weekly_aggregation: mean}
    soil_moisture: {display_name: 土壤墒情, unit: "原始值，单位待确认", weekly_aggregation: mean}
