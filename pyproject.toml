[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["03_src"]

[tool.pytest.ini_options]
pythonpath = ["03_src", "04_scripts"]
testpaths = ["08_tests"]
